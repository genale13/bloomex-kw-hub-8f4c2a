      ['search term', 'query', 'terme de recherche', 'termes de recherche'],
      ['campaign', 'campagne'],
      ['cost', 'cout', 'depenses', 'spend'],
      ['conversions', 'conv.', 'conv']
    ];
  } else if (kind === 'kw') {
    reqGroups = [
      ['keyword', 'search keyword', 'mot-cle', 'mot cle'],
      ['campaign', 'campagne'],
      ['cost', 'cout', 'depenses', 'spend']
    ];
  } else if (kind === 'bm') {
    reqGroups = [
      ['campaign', 'campagne'],
      ['cost', 'cout', 'depenses', 'spend']
    ];
  }
  const hIdx = findHeaderRowIndex(rows, reqGroups);
  if (hIdx === -1) {
    return { ok: false, reason: 'Missing required schema columns on ' + kind };
  }
  const hdrFold = rows[hIdx].map(c => foldText(c));
  const iPrimary = kind === 'st'
    ? colIdx(hdrFold, ['search term', 'query', 'terme de recherche', 'termes de recherche'])
    : (kind === 'kw'
        ? colIdx(hdrFold, ['keyword', 'search keyword', 'mot-cle', 'mot cle'])
        : colIdx(hdrFold, ['campaign', 'campagne']));
  const dataCount = rows.slice(hIdx + 1).filter(r => {
    const c0 = foldText((iPrimary >= 0 ? r[iPrimary] : r[0]) || '');
    return c0 && !c0.startsWith('total:') && c0 !== 'total' && !(kind !== 'st' && c0.startsWith('total'));
  }).length;
  if (requireNonEmptyRows && dataCount === 0) {
    return { ok: false, reason: 'Accidental 0-row wipe blocked on active tab (' + kind + ')' };
  }
  return { ok: true, headerIndex: hIdx, dataCount: dataCount, rows: rows };
}

function colIdx(hdrFold, aliases) {
  for (let i = 0; i < aliases.length; i++) {
    const idx = hdrFold.indexOf(aliases[i]);
    if (idx !== -1) return idx;
  }
  return -1;
}

function canonicalizeBundleRows(stRows, kwRows, bmRows) {
  const st = stRows.map(s => JSON.stringify([
    s.bs,
    rawTrim(s.search_term),
    rawTrim(s.match_type),
    rawTrim(s.added_excluded),
    rawTrim(s.campaign),
    rawTrim(s.campaign_type),
    rawTrim(s.sub_account),
    s.bs === 'fleur_quebec' ? 'CAD' : 'AUD',
    rawTrim(s.ad_group),
    rawTrim(s.keyword),
    Math.round(s.impressions || 0),
    Math.round(s.clicks || 0),
    Number(s.cost || 0).toFixed(2),
    Number(s.conversions || 0).toFixed(2),
    Number(s.conv_value || 0).toFixed(2)
  ])).sort();

  const kw = kwRows.map(k => JSON.stringify([
    k.bs,
    rawTrim(k.kw),
    rawTrim(k.mt),
    rawTrim(k.status),
    rawTrim(k.camp),
    rawTrim(k.ag),
    rawTrim(k.sub_account),
    k.bs === 'fleur_quebec' ? 'CAD' : 'AUD',
    Math.round(k.impr || 0),
    Math.round(k.clicks || 0),
    Number(k.cost || 0).toFixed(2),
    Number(k.conv || 0).toFixed(2),
    Number(k.val || 0).toFixed(2),
    rawTrim(k.strategy)
  ])).sort();

  const bm = bmRows.map(c => JSON.stringify([
    c.bs,
    rawTrim(c.camp),
    rawTrim(c.type),
    rawTrim(c.status),
    rawTrim(c.sub_account),
    c.bs === 'fleur_quebec' ? 'CAD' : 'AUD',
    Number(c.budget || 0).toFixed(2),
    rawTrim(c.strategy),
    Number(c.troas || 0).toFixed(2),
    Number(c.cost || 0).toFixed(2),
    Math.round(c.clicks || 0),
    Math.round(c.impr || 0)
  ])).sort();

  return { st: st, kw: kw, bm: bm };
}

function arrEq(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return false;
  }
  return true;
}

function matchesBaseline1mCanonical(stText, kwText, bmText) {
  if (!DB.baseline_1m_canonical) return false;
  const stRows = parseGoogleAdsCsv(stText, '');
  const kwRows = parseActiveKeywordsCsv(kwText, '');
  const bmRows = parseBrandBenchmarksCsv(bmText, '');
  const cand = canonicalizeBundleRows(stRows, kwRows, bmRows);
  return (
    arrEq(cand.st, DB.baseline_1m_canonical.st) &&
    arrEq(cand.kw, DB.baseline_1m_canonical.kw) &&
    arrEq(cand.bm, DB.baseline_1m_canonical.bm)
  );
}

function matchesBaseline1mBrand(bs, stRows, kwRows, bmRows) {
  if (!DB.baseline_1m_canonical) return false;
  const prefix = '["' + bs + '",';
  const cand = canonicalizeBundleRows(
    stRows.filter(r => r.bs === bs),
    kwRows.filter(r => r.bs === bs),
    bmRows.filter(r => r.bs === bs)
  );
  const refSt = DB.baseline_1m_canonical.st.filter(s => s.startsWith(prefix));
  const refKw = DB.baseline_1m_canonical.kw.filter(s => s.startsWith(prefix));
  const refBm = DB.baseline_1m_canonical.bm.filter(s => s.startsWith(prefix));
  return arrEq(cand.st, refSt) && arrEq(cand.kw, refKw) && arrEq(cand.bm, refBm);
}

// ============================================================================
// Gamma / Beta Posterior Math & Domain Lexicon
// ============================================================================

function logGamma(z) {
  const g = 7;
  const p = [
    0.99999999999980993, 676.5203681218851, -1259.1392167224028,
    771.32342877765313, -176.61502916214059, 12.507343278686905,
    -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7
  ];
  if (z < 0.5) {
    return Math.log(Math.PI) - Math.log(Math.sin(Math.PI * z)) - logGamma(1 - z);
  }
  z -= 1;
  let x = p[0];
  for (let i = 1; i < g + 2; i++) x += p[i] / (z + i);
  const t = z + g + 0.5;
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}

function gammaIncLowerReg(a, x) {
  if (x <= 0) return 0;
  if (x < a + 1) {
    let sum = 1 / a;
    let del = sum;
    for (let n = 1; n <= 160; n++) {
      del *= x / (a + n);
      sum += del;
      if (Math.abs(del) < Math.abs(sum) * 1e-10) break;
    }
    return Math.min(1, Math.max(0, sum * Math.exp(-x + a * Math.log(x) - logGamma(a))));
  }
  let b = x + 1 - a;
  let c = 1 / 1e-30;
  let d = 1 / b;
  let h = d;
  for (let i = 1; i <= 160; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b;
    if (Math.abs(d) < 1e-30) d = 1e-30;
    c = b + an / c;
    if (Math.abs(c) < 1e-30) c = 1e-30;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-10) break;
  }
  const q = Math.exp(-x + a * Math.log(x) - logGamma(a)) * h;
  return Math.min(1, Math.max(0, 1 - q));
}

function gammaSf(shape, rate, threshold) {
  if (threshold <= 0) return 1;
  if (shape <= 0 || rate <= 0) return 0;
  return 1 - gammaIncLowerReg(shape, rate * threshold);
}

function containsPhrase(termFold, phraseFold) {
  if (!phraseFold) return false;
  const padded = ' ' + termFold + ' ';
  return padded.indexOf(' ' + phraseFold + ' ') !== -1;
}

const SYMPATHY_TOKENS = [
  'sympathy', 'funeral', 'funerals', 'condolence', 'condolences', 'wreath', 'wreaths',
  'casket', 'memorial', 'bereavement', 'cemetery', 'chapel', 'obituary', 'cremation', 'tribute',
  'deuil', 'funerailles', 'funeraille', 'funeraire', 'condoleances', 'condoleance',
  'obseques', 'couronne', 'urne', 'hommage', 'salon funeraire', 'cimetiere', 'chapelle'
];

function isSympathyQuery(text) {
  const tf = foldText(text);
  if (!tf) return false;
  return SYMPATHY_TOKENS.some(tok => containsPhrase(tf, tok) || tf.includes(tok));
}

function classifyQueryIntent(termFold, bs) {
  const rules = DB.engine_rules || {};
  const lex = rules.lexicon || {};
  const prot = rules.protected || {};

  const ownBrandPhrases = bs === 'aussie_blooms'
    ? ['aussie blooms', 'aussieblooms', 'aussie bloom']
    : ['fleur quebec', 'fleurs quebec', 'fleur-quebec', 'fleurs-quebec'];

  const isOwnBrand = ownBrandPhrases.some(p => containsPhrase(termFold, p) || termFold === p);

  const seasonalList = [
    'valentine', 'saint valentin', 'st valentin', 'mothers day', 'fete des meres',
    'christmas', 'noel', 'easter', 'paques', 'anzac', 'lest we forget', 'remembrance day', 'poppy'
  ];
  const isSeasonal = seasonalList.some(p => containsPhrase(termFold, p));

  const auProtectedSet = new Set(
    ['australia', 'australian', 'aussie'].concat((prot.australia_cities || []).map(foldText))
  );
  const caProtectedSet = new Set(
    ['canada', 'canadian'].concat((prot.canada_cities || []).map(foldText))
  );

  const baseForeignGeo = ((lex.foreign_geo || []).map(foldText)).filter(g => {
    if (bs === 'aussie_blooms') return !auProtectedSet.has(g);
    return !caProtectedSet.has(g);
  });
  const foreignCities = baseForeignGeo.concat(
    (bs === 'aussie_blooms'
      ? (prot.canada_cities || [])
      : (prot.australia_cities || [])
    ).map(foldText)
  );

  const hardEn = (lex.hard && Array.isArray(lex.hard.en) ? lex.hard.en : []).map(foldText);
  const hardFr = (lex.hard && Array.isArray(lex.hard.fr) ? lex.hard.fr : []).map(foldText);
  const hardExtras = [
    'jobs', 'job', 'hiring', 'career', 'careers', 'salary', 'internship', 'emploi', 'emplois', 'recrutement',
    'free', 'gratuit', 'diy', 'how to', 'comment faire', 'artificial', 'faux', 'plastic', 'silk',
    'wikipedia', 'meaning', 'signification', 'pictures', 'photos', 'clipart', 'seeds', 'semences'
  ];
  const hardAll = hardEn.concat(bs === 'fleur_quebec' ? hardFr : []).concat(hardExtras);

  const carrierExcl = bs === 'aussie_blooms'
    ? ['australia post', 'auspost', 'startrack', 'star track', 'aramex', 'sendle', 'couriers please']
    : ['canada post', 'postes canada', 'purolator', 'fedex tracking', 'ups tracking'];

  const competitors = (lex.competitor || []).map(foldText).concat(
    bs === 'aussie_blooms'
      ? ['interflora', 'lvly', 'floraly', 'petals network', 'easyflowers', 'roses only', 'daily blooms', 'mr roses']
      : ['interflora', 'teleflora', '1800flowers', '1 800 flowers', 'ftd']
  );

  let hardCat = null;
  let compMatch = null;
  for (const c of competitors) {
    if (c && !ownBrandPhrases.includes(c) && containsPhrase(termFold, c)) {
      compMatch = c;
      break;
    }
  }
  if (!isOwnBrand) {
    if (hardAll.some(p => containsPhrase(termFold, p))) hardCat = 'hard_negative';
    else if (carrierExcl.some(p => containsPhrase(termFold, p))) hardCat = 'carrier_support';
    else if (foreignCities.some(p => containsPhrase(termFold, p))) hardCat = 'foreign_geo';
  }

  let queryType = 'non_brand';
  if (isOwnBrand) queryType = 'brand';
  else if (compMatch) queryType = 'competitor';

  return {
    isOwnBrand: isOwnBrand,
    isSeasonal: isSeasonal,
    isSympathy: isSympathyQuery(termFold),
    hardCat: hardCat,
    competitorMatch: compMatch,
    queryType: queryType
  };
}

function computeEmpiricalNgramsJs(stRows, bs, brandName, currency) {
  const stopSet = new Set(((DB.engine_rules && DB.engine_rules.stopwords) || []).map(foldText));
  const map = new Map();
  for (const r of stRows) {
    const toks = (r.term_fold || foldText(r.term || '')).split(' ').filter(Boolean);
    const seen = new Set();
    for (const n of [1, 2]) {
      for (let i = 0; i <= toks.length - n; i++) {
        const sub = toks.slice(i, i + n);
        if (sub.every(w => stopSet.has(w))) continue;
        const g = sub.join(' ');
        if (seen.has(g)) continue;
        seen.add(g);
        if (!map.has(g)) {
          map.set(g, { terms: new Set(), cost: 0, clicks: 0, conv: 0, val: 0, qtypes: new Set() });
        }
        const entry = map.get(g);
        entry.terms.add(r.term);
        entry.cost += r.cost;
        entry.clicks += r.clicks;
        entry.conv += r.conv;
        entry.val += r.val;
        entry.qtypes.add(r.qt || 'non_brand');
      }
    }
  }
  const minTerms = stRows.length >= 5 ? 2 : 1;
  const out = [];
  for (const [g, v] of map.entries()) {
    if (v.terms.size >= minTerms) {
      const roas = v.cost > 0 ? v.val / v.cost : 0;
      const qt = v.qtypes.size === 1 ? Array.from(v.qtypes)[0] : 'mixed';
      out.push({
        brand_slug: bs,
        brand_name: brandName,
        currency: currency,
        ngram: g,
        n_terms: v.terms.size,
        cost: Number(v.cost.toFixed(2)),
        clicks: Math.round(v.clicks),
        conv: Number(v.conv.toFixed(2)),
        value: Number(v.val.toFixed(2)),
        roas: Number(roas.toFixed(2)),
        query_type: qt
      });
    }
  }
  out.sort((a, b) => (b.cost - a.cost) || (b.roas - a.roas));
  return out.slice(0, 12);
}

// Baseline 1M Context & Per-Brand Standalone Scoring

function buildBaseline1mContext() {
  const camps = (DB.camps || []).slice();
  const campMap = new Map();
  camps.forEach((c, idx) => campMap.set(c, idx));
  const brands = {};
  for (const slug of BRAND_SLUGS) {
    const src = DB.brands[slug];
    brands[slug] = Object.assign({}, src, {
      search_terms: (DB.search_terms || []).filter(r => r.bs === slug),
      keywords: (DB.keywords || []).filter(k => k.bs === slug)
    });
  }
  return {
    periodKey: '1m',
    sourceLabel: 'baseline_1m',
    windowDays: 28,
    dateRange: DB.meta.date_range,
    camps: camps,
    campMap: campMap,
    brands: brands
  };
}

function buildEmptyBrandBundle(slug, periodKey) {
  const bm = brandMetaForSlug(slug);
  const prof = (DB.meta.period_profiles && DB.meta.period_profiles[periodKey]) || { days: 28, monthly_scale_factor: 1.0857 };
  const baseBrand = DB.brands[slug] || {};
  const proactiveCount = slug === 'fleur_quebec' ? (DB.proactive_seeds || []).length : 0;
  return {
    profile: Object.assign({}, baseBrand.profile || {}, bm),
    live_loaded: false,
    meta_info: {
      run_id: 'awaiting_' + slug + '_' + periodKey,
      generated_at: null,
      window_days: prof.days || 28,
      date_range: periodKey === '1m' ? DB.meta.date_range : null
    },
    coverage: {
      visible_cost: 0,
      total_cost: 0,
      ratio: null,
      currency: bm.currency,
      search_term_spend_analyzed: 0,
      keyword_spend_analyzed: 0,
      campaign_universe_spend: 0,
      search_term_coverage_ratio: null,
      keyword_coverage_ratio: null
    },
    account_kpis: {
      cost: 0,
      clicks: 0,
      impressions: 0,
      conversions: 0,
      conv_value: 0,
      cpc: null,
      cvr: null,
      cpa: null,
      roas: null,
      aov: null,
      currency: bm.currency,
      currency_symbol: bm.currency_symbol,
      live_loaded: false
    },
    impact_summary: {
      currency: bm.currency,
      live_loaded: false,
      window_days: prof.days || 28,
      monthly_scale_factor: prof.monthly_scale_factor || 1.0857,
      total_spend_analyzed: 0,
      search_term_spend_analyzed: 0,
      keyword_spend_analyzed: 0,
      campaign_universe_spend: 0,
      search_term_coverage_ratio: null,
      keyword_coverage_ratio: null,
      account_total_spend: 0,
      candidate_underperforming_spend_28d: 0,
      candidate_underperforming_spend_window: 0,
      negative_candidates_count: 0,
      keyword_bid_down_or_pause_count: 0,
      pmax_routing_gaps_count: 0,
      p1_harvest_count: 0,
      p2_budget_scale_campaigns_count: 0,
      positive_winners_count: 0,
      proactive_hard_total_rows: proactiveCount,
      conflicts_prevented_count: 0,
      est_monthly_reallocatable_spend: 0,
      est_monthly_incremental_revenue_directional: 0
    },
    campaign_baselines: [],
    negative_keywords: [],
    positive_opportunities: [],
    budget_recommendations: [],
    pmax_routing_gaps: [],
    positive_ngrams: [],
    empirical_ngrams: [],
    conflicts_prevented: [],
    search_terms: [],
    keywords: [],
    csv_exports: {
      negatives: 'Sub-account,Currency,Campaign,Ad group,Keyword,Match type,Level,Bucket,Spend,Conversions,Reason',
      positives: 'Sub-account,Currency,Source campaign,Target campaign,Ad group,Keyword,Match type,Bucket,Conversions,Conv. value,Cost,Observed ROAS,Posterior ROAS,Action',
      budgets: 'Sub-account,Currency,Campaign,Daily budget,Bid strategy,P2 spend,P2 conversions,P2 conv. value,P2 ROAS,Recommended action',
      proactive: (baseBrand.csv_exports && baseBrand.csv_exports.proactive) || 'Sub-account,Currency,Negative list,Keyword,Match type,Language',
      editor_negatives: 'Account,Campaign,Keyword,Criterion Type'
    }
  };
}

function scoreBrandStandalone(slug, stRowsRaw, kwRowsRaw, bmRowsRaw, periodKey, getCampIdx) {
  if (!stRowsRaw.length && !kwRowsRaw.length) {
    return buildEmptyBrandBundle(slug, periodKey);
  }
  const bm = brandMetaForSlug(slug);
  const prof = (DB.meta.period_profiles && DB.meta.period_profiles[periodKey]) || {
    days: 28,
    monthly_scale_factor: 30.4 / 28,
    min_clicks_n2: 45,
    min_spend_n2: 90,
    min_conv_p1: 2.0
  };
  const scaleFactor = prof.monthly_scale_factor || (30.4 / Math.max(1, prof.days || 28));
  const mPrior = 50.0;

  // Compute brand prior
  let totCostSt = 0, totClicksSt = 0, totImprSt = 0, totConvSt = 0, totValSt = 0;
  for (const r of stRowsRaw) {
    totCostSt += r.cost;
    totClicksSt += r.clicks;
    totImprSt += r.impressions;
    totConvSt += r.conversions;
    totValSt += r.conv_value;
  }
  let totCostKw = 0, totClicksKw = 0, totImprKw = 0, totConvKw = 0, totValKw = 0;
  for (const k of kwRowsRaw) {
    totCostKw += k.cost;
    totClicksKw += k.clicks;
    totImprKw += k.impr;
    totConvKw += k.conv;
    totValKw += k.val;
  }
  let totCostBm = 0;
  const bmByCamp = new Map();
  for (const b of bmRowsRaw) {
    totCostBm += b.cost;
    bmByCamp.set(b.camp, b);
  }

  // Primary account KPIs from fullest non-zero source (never fabricating)
  const useKwTotals = totCostKw > totCostSt;
  const acctCost = Math.max(totCostSt, totCostKw);
  const acctClicks = useKwTotals ? totClicksKw : totClicksSt;
  const acctImpr = useKwTotals ? totImprKw : totImprSt;
  const acctConv = useKwTotals ? totConvKw : totConvSt;
  const acctVal = useKwTotals ? totValKw : totValSt;
  const univCost = Math.max(totCostBm, acctCost);

  const brandLambda = acctClicks > 0 ? Math.max(0.015, acctConv / acctClicks) : 0.06;
  const brandAov = acctConv > 0 ? Math.max(25, acctVal / acctConv) : 60.0;
  const brandRoas = acctCost > 0 ? acctVal / acctCost : null;
  const brandCpa = acctConv > 0 ? acctCost / acctConv : null;
  const brandCpc = acctClicks > 0 ? acctCost / acctClicks : null;
  const brandCvr = acctClicks > 0 ? acctConv / acctClicks : null;

  // Active keyword index for conflict guard & P1 dedup
  const activeExactSet = new Set();
  const activeKwPhrases = [];
  for (const k of kwRowsRaw) {
    const kf = foldText(k.kw.replace(/^[\["']+|[\]"']+$/g, ''));
    if (!kf) continue;
    activeKwPhrases.push({ kw: k.kw, kf: kf, mt: k.mt, camp: k.camp, conv: k.conv, roas: k.cost > 0 ? k.val / k.cost : 0 });
    if (foldText(k.mt).includes('exact')) activeExactSet.add(kf);
  }

  // Per-campaign baselines
  const campAgg = new Map();
  for (const r of stRowsRaw) {
    if (!campAgg.has(r.campaign)) campAgg.set(r.campaign, { cost: 0, clicks: 0, conv: 0, val: 0 });
    const a = campAgg.get(r.campaign);
    a.cost += r.cost; a.clicks += r.clicks; a.conv += r.conversions; a.val += r.conv_value;
  }
  for (const k of kwRowsRaw) {
    if (!campAgg.has(k.camp)) campAgg.set(k.camp, { cost: 0, clicks: 0, conv: 0, val: 0 });
  }

  const campBaselines = [];
  const campBaseMap = new Map();
  for (const [cName, agg] of campAgg.entries()) {
    const bRow = bmByCamp.get(cName);
    const lam = (agg.conv + 15 * brandLambda) / Math.max(1, agg.clicks + 15);
    const aov = agg.conv >= 2 ? (agg.val / agg.conv) : brandAov;
    const cpc = agg.clicks > 0 ? (agg.cost / agg.clicks) : (brandCpc || 2.5);
    const roasStar = (lam * aov) / Math.max(0.05, cpc);
    const isBrandCamp = foldText(cName).includes('brand') || foldText(cName).includes('marque');
    const defaultTargetR = isBrandCamp ? 5.0 : 2.4;
    const R = (bRow && bRow.troas && bRow.troas > 0) ? bRow.troas : defaultTargetR;
    const T = aov / Math.max(0.5, R);
    const cb = {
      brand_slug: slug,
      brand_name: bm.display_name,
      sub_account: bm.sub_account,
      sub_account_cid: bm.cid,
      currency: bm.currency,
      campaign: cName,
      lambda_star: Number(lam.toFixed(5)),
      aov_star: Number(aov.toFixed(2)),
      cpc_campaign: Number(cpc.toFixed(2)),
      T: Number(T.toFixed(2)),
      R: Number(R.toFixed(2)),
      m: mPrior,
      bid_strategy: bRow ? bRow.strategy : null,
      daily_budget_cad: bRow && bRow.budget > 0 ? bRow.budget : null
    };
    campBaselines.push(cb);
    campBaseMap.set(cName, cb);
  }

  const compactSt = [];
  const negCandidates = [];
  const posOpportunities = [];
  const conflictsPrevented = [];
  const p2ByCamp = new Map();

  for (const r of stRowsRaw) {
    const cb = campBaseMap.get(r.campaign) || { lambda_star: brandLambda, aov_star: brandAov, T: 25, R: 2.4, m: mPrior };
    const intent = classifyQueryIntent(r.term_fold, slug);
    const alphaPost = mPrior * cb.lambda_star + r.conversions;
    const betaPost = mPrior + r.clicks;
    const postCvr = alphaPost / Math.max(1, betaPost);
    const cpcObs = r.clicks > 0 ? (r.cost / r.clicks) : cb.cpc_campaign || 2.0;
    const aovEff = r.conversions >= 1 ? (0.5 * (r.conv_value / r.conversions) + 0.5 * cb.aov_star) : cb.aov_star;
    const roasPost = cpcObs > 0 ? (postCvr * aovEff) / cpcObs : 0;
    const cpaPost = postCvr > 0 ? cpcObs / postCvr : null;
    const obsRoas = r.cost > 0 ? r.conv_value / r.cost : 0;
    const obsCpa = r.conversions > 0 ? r.cost / r.conversions : null;
    const pBe = Math.min(0.95, Math.max(0.005, (cpcObs * cb.R) / Math.max(1, aovEff)));
    const pWin = gammaSf(alphaPost, betaPost, pBe);

    let bucket = 'HOLD';
    let action = 'hold_observe';
    let review = 'none';
    let reason = 'Within normal statistical variance; continue observing.';

    if (intent.hardCat && r.conversions === 0) {
      bucket = 'N1_HARD';
      action = 'add_negative_phrase';
      review = 'recommended';
      reason = 'Off-intent lexical match (' + intent.hardCat + ') with 0 conversions.';
    } else if (
      !intent.isOwnBrand &&
      !intent.isSeasonal &&
      r.clicks >= (prof.min_clicks_n2 || 30) &&
      r.cost >= (prof.min_spend_n2 || 60) &&
      roasPost < cb.R * 0.65 &&
      pWin < 0.15
    ) {
      const isAddedKw = foldText(r.added_excluded).includes('added') || activeExactSet.has(r.term_fold);
      if (isAddedKw) {
        bucket = 'N2_KEYWORD';
        action = 'bid_down_15pct';
        review = 'required';
        reason = 'Underperforming active keyword (ROAS_post=' + roasPost.toFixed(2) + 'x < target ' + cb.R.toFixed(2) + 'x).';
      } else {
        bucket = 'N2_STAT';
        action = 'add_negative_exact';
        review = 'required';
        reason = 'Statistically underperforming search term (' + r.clicks + ' clicks, ROAS_post=' + roasPost.toFixed(2) + 'x vs ' + cb.R.toFixed(2) + 'x).';
      }
    } else if (
      r.conversions >= (prof.min_conv_p1 || 2.0) &&
      roasPost >= cb.R &&
      pWin >= 0.70
    ) {
      const isAdded = foldText(r.added_excluded).includes('added') || activeExactSet.has(r.term_fold);
      if (!isAdded) {
        bucket = 'P1_HARVEST';
        action = 'add_exact';
        review = 'required';
        reason = 'Unadded converting query (' + r.conversions.toFixed(1) + ' conv, ROAS_post=' + roasPost.toFixed(2) + 'x >= ' + cb.R.toFixed(2) + 'x).';
      } else {
        bucket = 'P2_SCALE';
        action = 'scale_campaign_budget';
        review = 'recommended';
        reason = 'Confirmed Exact winner beating target ROAS (' + roasPost.toFixed(2) + 'x vs ' + cb.R.toFixed(2) + 'x).';
      }
    } else if (intent.isSeasonal && r.cost > 0 && roasPost < cb.R) {
      bucket = 'SEASONAL_HOLD';
      action = 'seasonal_protect';
      reason = 'Protected seasonal/commemorative intent.';
    }

    // Conflict guardrail on negative candidates
    if (bucket === 'N1_HARD' || bucket === 'N2_STAT') {
      const conflict = activeKwPhrases.find(ak => ak.conv > 0 && ak.roas >= 1.5 && (ak.kf === r.term_fold || (bucket === 'N1_HARD' && containsPhrase(ak.kf, r.term_fold))));
      if (conflict) {
        conflictsPrevented.push({
          brand_slug: slug,
          currency: bm.currency,
          candidate_negative: r.search_term,
          protected_keyword: conflict.kw,
          campaign: conflict.camp,
          reason: 'Blocked negative that would collide with converting active keyword [' + conflict.kw + '].'
        });
        bucket = 'HOLD';
        action = 'conflict_blocked';
        reason = 'Guardrail prevented collision with converting keyword [' + conflict.kw + '].';
      } else {
        negCandidates.push({
          brand_slug: slug,
          brand_name: bm.display_name,
          sub_account: bm.sub_account,
          sub_account_cid: bm.cid,
          currency: bm.currency,
          campaign: r.campaign,
          ad_group: r.ad_group || 'All Ad Groups',
          keyword: r.search_term,
          match_type: bucket === 'N1_HARD' ? 'Phrase' : 'Exact',
          level: 'Campaign',
          bucket: bucket,
          cost: Number(r.cost.toFixed(2)),
          clicks: r.clicks,
          conversions: Number(r.conversions.toFixed(2)),
          conv_value: Number(r.conv_value.toFixed(2)),
          roas_post: Number(roasPost.toFixed(2)),
          routing_hold: false,
          review_state: review,
          reason: reason
        });
      }
    }

    if (bucket === 'P1_HARVEST') {
      posOpportunities.push({
        brand_slug: slug,
        brand_name: bm.display_name,
        sub_account: bm.sub_account,
        sub_account_cid: bm.cid,
        currency: bm.currency,
        keyword: r.search_term,
        query_type: intent.queryType,
        campaign: 'TBD - Select/Create Search Campaign',
        source_campaign: r.campaign,
        ad_group: r.ad_group || 'TBD - Search Ad Group',
        recommended_match_type: 'Exact',
        bucket: 'P1_HARVEST',
        conversions: Number(r.conversions.toFixed(2)),
        conv_value: Number(r.conv_value.toFixed(2)),
        cost: Number(r.cost.toFixed(2)),
        roas: Number(obsRoas.toFixed(2)),
        cpa: obsCpa != null ? Number(obsCpa.toFixed(2)) : null,
        roas_post: Number(roasPost.toFixed(2)),
        cpa_post: cpaPost != null ? Number(cpaPost.toFixed(2)) : null,
        p_win: Number(pWin.toFixed(4)),
        action: 'add_exact',
        review_state: 'required',
        reason: reason
      });
    }

    if (bucket === 'P2_SCALE') {
      if (!p2ByCamp.has(r.campaign)) {
        p2ByCamp.set(r.campaign, { entities: [], spend: 0, conv: 0, val: 0 });
      }
      const p2 = p2ByCamp.get(r.campaign);
      p2.entities.push(r.search_term);
      p2.spend += r.cost;
      p2.conv += r.conversions;
      p2.val += r.conv_value;
    }

    const ci = getCampIdx(r.campaign);
    compactSt.push({
      bs: slug,
      bn: bm.display_name,
      cur: bm.currency,
      cid: bm.cid,
      ci: ci,
      ag: r.ad_group || 'All Ad Groups',
      term: r.search_term,
      term_fold: r.term_fold,
      qt: intent.queryType,
      cm: intent.competitorMatch,
      mt: r.match_type,
      st: r.added_excluded,
      brand: intent.isOwnBrand,
      seasonal: intent.isSeasonal,
      impr: r.impressions,
      clicks: r.clicks,
      cost: Number(r.cost.toFixed(2)),
      conv: Number(r.conversions.toFixed(2)),
      val: Number(r.conv_value.toFixed(2)),
      cpc: Number(cpcObs.toFixed(2)),
      obs_roas: Number(obsRoas.toFixed(2)),
      obs_cpa: obsCpa != null ? Number(obsCpa.toFixed(2)) : null,
      T: cb.T,
      R: cb.R,
      p_be: Number(pBe.toFixed(4)),
      post_cvr: Number(postCvr.toFixed(4)),
      cvr_ci90: [Number(Math.max(0, postCvr * 0.7).toFixed(4)), Number(Math.min(1, postCvr * 1.3).toFixed(4))],
      cpa_post: cpaPost != null ? Number(cpaPost.toFixed(2)) : null,
      roas_post: Number(roasPost.toFixed(2)),
      p_win: Number(pWin.toFixed(4)),
      bucket: bucket,
      raw_bucket: bucket,
      action: action,
      review: review,
      reason: reason
    });
  }

  // Score active keywords
  const compactKw = [];
  for (const k of kwRowsRaw) {
    const cb = campBaseMap.get(k.camp) || { lambda_star: brandLambda, aov_star: brandAov, T: 25, R: 2.4, m: mPrior };
    const kf = foldText(k.kw);
    const intent = classifyQueryIntent(kf, slug);
    const alphaPost = mPrior * cb.lambda_star + k.conv;
    const betaPost = mPrior + k.clicks;
    const postCvr = alphaPost / Math.max(1, betaPost);
    const cpcObs = k.clicks > 0 ? k.cost / k.clicks : cb.cpc_campaign || 2.0;
    const aovEff = k.conv >= 1 ? (0.5 * (k.val / k.conv) + 0.5 * cb.aov_star) : cb.aov_star;
    const roasPost = cpcObs > 0 ? (postCvr * aovEff) / cpcObs : 0;
    const cpaPost = postCvr > 0 ? cpcObs / postCvr : null;
    const obsRoas = k.cost > 0 ? k.val / k.cost : 0;
    const obsCpa = k.conv > 0 ? k.cost / k.conv : null;
    const pBe = Math.min(0.95, Math.max(0.005, (cpcObs * cb.R) / Math.max(1, aovEff)));
    const pWin = gammaSf(alphaPost, betaPost, pBe);

    let bucket = 'HOLD';
    let action = 'hold_observe';
    if (k.conv >= 3 && roasPost >= cb.R && pWin >= 0.70) {
      bucket = 'P2_SCALE';
      action = 'scale_campaign_budget';
      if (!p2ByCamp.has(k.camp)) {
        p2ByCamp.set(k.camp, { entities: [], spend: 0, conv: 0, val: 0 });
      }
      const p2 = p2ByCamp.get(k.camp);
      if (!p2.entities.includes('[' + k.kw + ']')) {
        p2.entities.push('[' + k.kw + ']');
        p2.spend += k.cost;
        p2.conv += k.conv;
        p2.val += k.val;
      }
    } else if (!intent.isOwnBrand && k.clicks >= (prof.min_clicks_n2 || 35) && roasPost < cb.R * 0.60 && pWin < 0.15) {
      bucket = 'N2_KEYWORD';
      action = 'bid_down_15pct';
    }

    compactKw.push({
      bs: slug,
      bn: bm.display_name,
      cur: bm.currency,
      cid: bm.cid,
      ci: getCampIdx(k.camp),
      ag: k.ag || 'All Ad Groups',
      keyword: k.kw,
      qt: intent.queryType,
      cm: intent.competitorMatch,
      mt: k.mt,
      origin: 'keywords_table',
      impr: k.impr,
      clicks: k.clicks,
      cost: Number(k.cost.toFixed(2)),
      conv: Number(k.conv.toFixed(2)),
      val: Number(k.val.toFixed(2)),
      obs_roas: Number(obsRoas.toFixed(2)),
      obs_cpa: obsCpa != null ? Number(obsCpa.toFixed(2)) : null,
      roas_post: Number(roasPost.toFixed(2)),
      cpa_post: cpaPost != null ? Number(cpaPost.toFixed(2)) : null,
      T: cb.T,
      R: cb.R,
      p_win: Number(pWin.toFixed(4)),
      bucket: bucket,
      action: action,
      budget: cb.daily_budget_cad,
      strategy: k.strategy || cb.bid_strategy
    });
  }

  const budgetRecs = [];
  let totalP2Val = 0;
  for (const [cName, p2] of p2ByCamp.entries()) {
    const cb = campBaseMap.get(cName) || {};
    totalP2Val += p2.val;
    budgetRecs.push({
      brand_slug: slug,
      brand_name: bm.display_name,
      sub_account: bm.sub_account,
      sub_account_cid: bm.cid,
      currency: bm.currency,
      campaign: cName,
      daily_budget_cad: cb.daily_budget_cad || null,
      bid_strategy: cb.bid_strategy || 'Smart Bidding',
      winning_entity_count: p2.entities.length,
      top_winning_entities: p2.entities.slice(0, 3),
      p2_spend: Number(p2.spend.toFixed(2)),
      p2_conversions: Number(p2.conv.toFixed(2)),
      p2_conv_value: Number(p2.val.toFixed(2)),
      p2_roas: p2.spend > 0 ? Number((p2.val / p2.spend).toFixed(2)) : 0,
      action: 'raise_budget_10_or_loosen_target_5',
      review_state: 'required',
      headroom_note: 'Verify budget-limited status & Search Lost IS headroom before raising budget +10%.'
    });
  }

  const negSpend = negCandidates.reduce((s, n) => s + n.cost, 0);
  const n2kCount = compactSt.filter(r => r.bucket === 'N2_KEYWORD').length + compactKw.filter(k => k.bucket === 'N2_KEYWORD').length;
  const estUpMo = Number((totalP2Val * 0.10 * scaleFactor + posOpportunities.reduce((s, p) => s + p.conv_value * 0.08, 0) * scaleFactor).toFixed(2));
  const empNgrams = computeEmpiricalNgramsJs(compactSt, slug, bm.display_name, bm.currency);

  // Build brand-isolated CSV exports
  const negCsvLines = [
    'Sub-account,Currency,Campaign,Ad group,Keyword,Match type,Level,Bucket,Spend,Conversions,Reason'
  ].concat(negCandidates.map(n => [
    csvCell(bm.sub_account), csvCell(bm.currency), csvCell(n.campaign), csvCell(n.ad_group),
    csvCell(n.keyword), csvCell(n.match_type), csvCell(n.level), csvCell(n.bucket),
    n.cost.toFixed(2), n.conversions.toFixed(2), csvCell(n.reason)
  ].join(',')));

  const editorNegLines = ['Account,Campaign,Keyword,Criterion Type'].concat(
    negCandidates.filter(n => !n.routing_hold).map(n => [
      csvCell(bm.cid), csvCell(n.campaign), csvCell(n.keyword),
      csvCell('Negative ' + n.match_type)
    ].join(','))
  );

  const posCsvLines = [
    'Sub-account,Currency,Source campaign,Target campaign,Ad group,Keyword,Match type,Bucket,Conversions,Conv. value,Cost,Observed ROAS,Posterior ROAS,Action'
  ].concat(posOpportunities.map(p => [
    csvCell(bm.sub_account), csvCell(bm.currency), csvCell(p.source_campaign), csvCell(p.campaign),
    csvCell(p.ad_group), csvCell(p.keyword), csvCell(p.recommended_match_type), csvCell(p.bucket),
    p.conversions.toFixed(2), p.conv_value.toFixed(2), p.cost.toFixed(2),

function scoreDataset(stRows, kwRows, bmRows, periodKey, sourceLabel) {
  const camps = (DB.camps || []).slice();
  const campMap = new Map();
  camps.forEach((c, idx) => campMap.set(c, idx));
  function getCampIdx(cName) {
    const s = String(cName || '');
    if (!campMap.has(s)) {
      campMap.set(s, camps.length);
      camps.push(s);
    }
    return campMap.get(s);
  }

  const brands = {};
  for (const slug of BRAND_SLUGS) {
    if (periodKey === '1m' && matchesBaseline1mBrand(slug, stRows, kwRows, bmRows)) {
      brands[slug] = BASELINE_1M_CTX.brands[slug];
    } else {
      brands[slug] = scoreBrandStandalone(
        slug,
        stRows.filter(r => r.bs === slug),
        kwRows.filter(k => k.bs === slug),
        bmRows.filter(b => b.bs === slug),
        periodKey,
        getCampIdx
      );
    }
  }

  const prof = (DB.meta.period_profiles && DB.meta.period_profiles[periodKey]) || { days: 28 };
  return {
    periodKey: periodKey,
    sourceLabel: sourceLabel || 'live_scored',
    windowDays: prof.days || 28,
    dateRange: periodKey === '1m' ? DB.meta.date_range : null,
    camps: camps,
    campMap: campMap,
    brands: brands
  };
}

// ============================================================================
// v3.0 Localization (Québécois French fr-CA & Australian/Canadian English)
// Strict Currency Formatting: CAD ($ CA / CA$) vs AUD ($ AU / A$) — NEVER mixed
// ============================================================================

function fmtGroupInt(intStr, sep) {
  return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
}

function fmtNum(val, lang, digits) {
  if (val == null || !Number.isFinite(Number(val))) return '—';
  const d = digits == null ? 0 : digits;
  const n = Number(val);
  const sign = n < 0 ? '-' : '';
  const fixed = Math.abs(n).toFixed(d);
  const parts = fixed.split('.');
  if (lang === 'fr') {
    const grp = fmtGroupInt(parts[0], '\u202f');
    return sign + (parts.length > 1 ? grp + ',' + parts[1] : grp);
  }
  const grp = fmtGroupInt(parts[0], ',');
  return sign + (parts.length > 1 ? grp + '.' + parts[1] : grp);
}

function fmtMoney(amount, currency, lang) {
  if (amount == null || !Number.isFinite(Number(amount))) return '—';
  const cur = String(currency || 'CAD').toUpperCase();
  const n = Number(amount);
  const sign = n < 0 ? '-' : '';
  const absFixed = Math.abs(n).toFixed(2);
  const parts = absFixed.split('.');
  if (lang === 'fr') {
    const numStr = fmtGroupInt(parts[0], '\u202f') + ',' + parts[1];
    const suffix = cur === 'AUD' ? '\u00a0$\u00a0AU' : '\u00a0$\u00a0CA';
    return sign + numStr + suffix;
  }
  const numStr = fmtGroupInt(parts[0], ',') + '.' + parts[1];
  const prefix = cur === 'AUD' ? 'A$' : 'CA$';
  return sign + prefix + numStr;
}

function fmtRoas(val, lang) {
  if (val == null || !Number.isFinite(Number(val))) return '—';
  return fmtNum(val, lang, 2) + '×';
}

function fmtPct(ratio, lang, digits) {
  if (ratio == null || !Number.isFinite(Number(ratio))) return '—';
  const d = digits == null ? 1 : digits;
  const pct = Number(ratio) * 100;
  return fmtNum(pct, lang, d) + (lang === 'fr' ? '\u00a0%' : '%');
}

function tr(lang, key, vars) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] != null ? dict[key] : (I18N.en[key] || key);
  if (vars && typeof str === 'string') {
    for (const [k, v] of Object.entries(vars)) {
      str = str.split('{' + k + '}').join(String(v));
    }
  }
  return str;
}


    const BASELINE_1M_CTX = buildBaseline1mContext();

    // Parse URL parameters (?brand=fleur_quebec|aussie_blooms, ?period=1w..9m, ?mode=readonly, ?lang=fr|en, ?theme=light|dark)
    const urlParams = new URLSearchParams(window.location.search || '');
    const initBrandParam = urlParams.get('brand');
    const initBrand = BRAND_SLUGS.includes(initBrandParam) ? initBrandParam : (DB.meta.default_brand || 'fleur_quebec');
    const validPeriods = DB.meta.period_order || ['1w', '2w', '1m', '3m', '9m'];
    const initPeriodParam = urlParams.get('period');
    const initPeriod = validPeriods.includes(initPeriodParam) ? initPeriodParam : (DB.meta.active_period || '1m');
    const initLangParam = urlParams.get('lang');
    const initReadOnly = urlParams.get('mode') === 'readonly' || urlParams.get('readonly') === '1';
    const initTheme = urlParams.get('theme') === 'dark' ? 'dark' : 'light';

    const state = {
      brand: initBrand,
      period: initPeriod,
      lang: (initLangParam === 'en' || initLangParam === 'fr') ? initLangParam : (initBrand === 'aussie_blooms' ? 'en' : 'fr'),

    function getActiveBrandBundle() {
      return getBrandBundleFor(state.brand, state.period);
    }

    function getBrandBundleFor(slug, periodKey) {
      const localKey = periodKey + '::' + slug;
      if (state.localOverrideByPeriodBrand[localKey]) {
        return state.localOverrideByPeriodBrand[localKey];
      }
      const sheetCtx = state.sheetCtxByPeriod[periodKey];
      if (sheetCtx && sheetCtx.brands && sheetCtx.brands[slug]) {
        return sheetCtx.brands[slug];
      }
      return buildEmptyBrandBundle(slug, periodKey);
    }

    function getCampsArray() {
      const localKey = state.period + '::' + state.brand;
      if (state.localOverrideByPeriodBrand[localKey] && state.localOverrideByPeriodBrand[localKey]._camps) {
        return state.localOverrideByPeriodBrand[localKey]._camps;
      }
      const sheetCtx = state.sheetCtxByPeriod[state.period];
      return (sheetCtx && sheetCtx.camps) || DB.camps || [];
    }

    function applyRootAttributes() {
      const root = document.documentElement;
      root.setAttribute('data-brand', state.brand);
      root.setAttribute('data-theme', state.theme);
      root.setAttribute('lang', state.lang === 'fr' ? 'fr-CA' : 'en-AU');
      if (!IS_WEB_APP) {
        document.getElementById('btnThemeToggle').classList.add('hidden');
      }

    function setBrand(slug) {
      if (!BRAND_SLUGS.includes(slug)) return;
      state.brand = slug;
      state.campaignFilter = 'all';
      state.selectedBubbleIdx = 0;
      if (!state.langPinned) {
        state.lang = slug === 'aussie_blooms' ? 'en' : 'fr';
      }
      renderAll();
    }

    function buildQuadrantNodes(stRows, kwRows, camps) {
      const combined = stRows.map(r => ({
        label: r.term,
        camp: camps[r.ci] || '',
        cost: r.cost,
        conv: r.conv,
        val: r.val,
        obsRoas: r.obs_roas,
        postRoas: r.roas_post,
        targetR: r.R || 2.5,
        pWin: r.p_win,
        bucket: r.bucket,
        reason: r.reason
      }));
      const seenLabels = new Set(combined.map(x => foldText(x.label)));
      for (const k of kwRows) {
        if (k.bucket === 'P2_SCALE' && !seenLabels.has(foldText(k.keyword))) {
          combined.push({
            label: '[' + k.keyword + ']',
            camp: camps[k.ci] || '',
            cost: k.cost,
            conv: k.conv,
            val: k.val,
            obsRoas: k.obs_roas,
            postRoas: k.roas_post,
            targetR: k.R || 2.5,
            pWin: k.p_win,
            bucket: k.bucket,
            reason: 'Confirmed Exact scaling keyword'
          });
        }
      }
      return combined;
    }

    function isSympathyContextActive() {
      if (state.rowFilter === 'sympathy') return true;
      if (isSympathyQuery(state.searchQuery || '')) return true;
      if (state.campaignFilter && state.campaignFilter !== 'all' && isSympathyQuery(state.campaignFilter)) return true;
      const b = getActiveBrandBundle();
      if (b && b.live_loaded) {
        const camps = getCampsArray();
        const stFiltered = filterEntities(b.search_terms || [], camps, false);
        const kwFiltered = filterEntities(b.keywords || [], camps, true);
        const qNodes = buildQuadrantNodes(stFiltered, kwFiltered, camps);
        if (qNodes.length > 0) {
          const selIdx = Math.min(state.selectedBubbleIdx, qNodes.length - 1);
          const selNode = qNodes[selIdx];
          if (selNode && isSympathyQuery((selNode.label || '') + ' ' + (selNode.camp || ''))) {
            return true;
          }
        }
        const totalVisible = stFiltered.length + kwFiltered.length;
        if (totalVisible > 0) {
          const allStSymp = stFiltered.every(r => isSympathyQuery((r.term || '') + ' ' + (camps[r.ci] || '')));
          const allKwSymp = kwFiltered.every(k => isSympathyQuery((k.keyword || '') + ' ' + (camps[k.ci] || '')));
          if (allStSymp && allKwSymp) return true;
        }
      }
      return false;
    }

      const abWrap = document.getElementById('abTaglineWrap');

    function statusMeta(bucket, lang) {
      if (bucket === 'P1_HARVEST') {
        return { cls: 'status-leaf', icon: '▲', label: tr(lang, 'status_winner'), stroke: '#059669', fill: 'rgba(16,185,129,0.24)' };
      }
      if (bucket === 'P2_SCALE') {
        return { cls: 'status-leaf', icon: '◆', label: tr(lang, 'status_scale'), stroke: '#0d9488', fill: 'rgba(20,184,166,0.24)' };
      }
      if (bucket === 'N1_HARD' || bucket === 'N2_STAT') {
        return { cls: 'status-rose', icon: '✕', label: tr(lang, 'status_exclude'), stroke: '#e11d48', fill: 'rgba(225,29,72,0.24)' };
      }
      if (bucket === 'N2_KEYWORD') {
        return { cls: 'status-amber', icon: '▼', label: tr(lang, 'status_bid_down'), stroke: '#d97706', fill: 'rgba(217,119,6,0.24)' };
      }
      if (bucket === 'SEASONAL_HOLD') {
        return { cls: 'status-amber', icon: '★', label: tr(lang, 'status_seasonal'), stroke: '#b45309', fill: 'rgba(245,158,11,0.22)' };
      }
      return { cls: 'status-neutral', icon: '•', label: tr(lang, 'status_hold'), stroke: '#64748b', fill: 'rgba(100,116,139,0.20)' };
    }

        syncText = tr(L, 'sync_checking');

        const sec = Math.max(0, Math.round((Date.now() - state.lastCheckedTs) / 1000));

    function handleCsvUploadFile(file, targetBrandSlug) {
      if (!file || state.readOnly) return;
      const uploadPeriod = state.period;
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '');
        const bm = brandMetaForSlug(targetBrandSlug);
        const schemaCheck = validateSheetCsvSchema(text, 'st', false);
        if (!schemaCheck.ok || schemaCheck.dataCount === 0) {
          state.syncError = state.lang === 'fr'
            ? 'Fichier CSV non reconnu ou vide : colonnes Search term, Campaign, Cost et Conversions requises.'
            : 'Unrecognized or empty CSV: Search term, Campaign, Cost, and Conversions columns required.';
          renderFreshnessStrip();
          return;
        }
        const rows = parseGoogleAdsCsv(text, targetBrandSlug);
        const brandRows = rows.filter(r => r.bs === targetBrandSlug);
        if (brandRows.length === 0 || brandRows.length < schemaCheck.dataCount) {
          const rejectedCnt = schemaCheck.dataCount - brandRows.length;
          state.syncError = state.lang === 'fr'
            ? ('Import refusé (' + rejectedCnt + '/' + schemaCheck.dataCount + ' ligne(s) hors ' + bm.display_name + ' · ' + bm.currency + ') : fichiers mixtes ou autre devise bloqués (CAD ≠ AUD).')
            : ('Upload rejected (' + rejectedCnt + '/' + schemaCheck.dataCount + ' row(s) did not match ' + bm.display_name + ' · ' + bm.currency + '): mixed-currency / cross-brand imports blocked (CAD ≠ AUD).');
          renderFreshnessStrip();
          return;
        }
        state.syncError = null;
        const camps = (DB.camps || []).slice();
        const campMap = new Map();
        camps.forEach((c, idx) => campMap.set(c, idx));
        function getCampIdx(cName) {
          const s = String(cName || '');
          if (!campMap.has(s)) { campMap.set(s, camps.length); camps.push(s); }
          return campMap.get(s);
        }
        const scored = scoreBrandStandalone(targetBrandSlug, brandRows, [], [], uploadPeriod, getCampIdx);
        scored._camps = camps;
        state.localOverrideByPeriodBrand[uploadPeriod + '::' + targetBrandSlug] = scored;
        if (state.period === uploadPeriod && state.brand === targetBrandSlug) {
          state.campaignFilter = 'all';
          state.selectedBubbleIdx = 0;
        }
        renderAll();
      };
      reader.onerror = () => {
        state.syncError = state.lang === 'fr'
          ? 'Erreur de lecture du fichier CSV.'
          : 'Failed to read CSV file.';
        renderFreshnessStrip();
      };
      reader.readAsText(file);
    }

    function triggerDownload(filename, content) {
      const bom = '\uFEFF';
      const blob = new Blob([bom + content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 150);
    }

    function filterEntities(rows, camps, isKw) {
      const q = foldText(state.searchQuery);
      return rows.filter(r => {
        const text = isKw ? r.keyword : r.term;
        const campName = camps[r.ci] || '';
        if (state.campaignFilter && state.campaignFilter !== 'all' && campName !== state.campaignFilter) return false;
        if (state.rowFilter === 'winners' && !(r.bucket === 'P1_HARVEST' || r.bucket === 'P2_SCALE')) return false;
        if (state.rowFilter === 'exclusions' && !(r.bucket === 'N1_HARD' || r.bucket === 'N2_STAT' || r.bucket === 'N2_KEYWORD')) return false;
        if (state.rowFilter === 'hold' && !(r.bucket === 'HOLD' || r.bucket === 'SEASONAL_HOLD')) return false;
        if (state.rowFilter === 'sympathy' && !isSympathyQuery(text + ' ' + campName)) return false;
        if (q) {
          const hay = foldText(text + ' ' + campName + ' ' + (r.ag || '') + ' ' + (r.bucket || ''));
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

      const combined = buildQuadrantNodes(stRows, kwRows, camps);

      if (!combined.length) {
        stage.innerHTML = '<div class="rounded-xl border border-[var(--border)] p-6 text-center text-xs text-[var(--muted-foreground)]">' +
          escHtml(L === 'fr' ? 'Aucune ligne ne correspond à ce filtre.' : 'No rows match the active filter.') + '</div>';
        return;
      }

      const selIdx = Math.min(state.selectedBubbleIdx, combined.length - 1);
      const sel = combined[selIdx];
      const W = 820, H = 300;
      const padL = 62, padR = 24, padT = 20, padB = 42;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxCost = Math.max(400, ...combined.map(n => n.cost * 1.1));
      const maxRoas = Math.max(6.0, ...combined.map(n => Math.min(12, n.postRoas * 1.12)));
      const xOf = c => padL + (Math.min(maxCost, Math.max(0, c)) / maxCost) * plotW;
      const yOf = r => padT + plotH - (Math.min(maxRoas, Math.max(0, r)) / maxRoas) * plotH;
      const yRef = yOf(2.5);

      const bubblesSvg = combined.map((n, idx) => {
        const cx = xOf(n.cost).toFixed(1);
        const cy = yOf(n.postRoas).toFixed(1);
        const rad = Math.max(6.5, Math.min(18, 5.5 + Math.sqrt(Math.max(0, n.conv)) * 1.35)).toFixed(1);
        const sm = statusMeta(n.bucket, L);
        const isSel = idx === selIdx;
        return (
          '<g class="cursor-pointer" data-bidx="' + idx + '">' +
            (isSel ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + (Number(rad) + 4).toFixed(1) + '" fill="none" stroke="#D6A61F" stroke-width="2.5" />' : '') +
            '<circle cx="' + cx + '" cy="' + cy + '" r="' + rad + '" fill="' + sm.fill + '" stroke="' + sm.stroke + '" stroke-width="' + (isSel ? '2.5' : '1.7') + '" />' +
          '</g>'
        );
      }).join('');

      const selMeta = statusMeta(sel.bucket, L);
      stage.innerHTML =
        '<div class="space-y-3">' +
          '<div class="flex flex-wrap items-center justify-between gap-2">' +
            '<div>' +
              '<h3 class="text-sm sm:text-base font-bold m-0">' + escHtml(tr(L, 'quadrant_title')) + '</h3>' +
              '<p class="text-xs text-[var(--muted-foreground)] m-0">' + escHtml(tr(L, 'quadrant_sub')) + '</p>' +
            '</div>' +
            '<div class="flex flex-wrap items-center gap-2 text-xs">' +
              '<span class="px-2 py-0.5 rounded status-leaf">▲ ' + escHtml(tr(L, 'status_winner')) + '</span>' +
              '<span class="px-2 py-0.5 rounded status-neutral">• ' + escHtml(tr(L, 'status_hold')) + '</span>' +
              '<span class="px-2 py-0.5 rounded status-rose">✕ ' + escHtml(tr(L, 'status_exclude')) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="rounded-xl border border-[var(--border)] p-3 overflow-x-auto">' +
            '<svg viewBox="0 0 ' + W + ' ' + H + '" class="w-full min-w-[300px] h-[250px] sm:h-[290px]" role="img" aria-label="Quadrant Bubble Matrix">' +
              '<line x1="' + padL + '" y1="' + yRef.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yRef.toFixed(1) + '" stroke="#D6A61F" stroke-dasharray="5 4" stroke-width="1.4" />' +
              '<text x="' + (W - padR - 4) + '" y="' + (yRef - 6).toFixed(1) + '" text-anchor="end" font-size="12" fill="currentColor" opacity="0.8">tROAS 2.50×</text>' +
              '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="currentColor" stroke-opacity="0.25" />' +
              '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) + '" stroke="currentColor" stroke-opacity="0.25" />' +
              '<text x="' + padL + '" y="' + (H - 12) + '" font-size="12" fill="currentColor" opacity="0.7">0</text>' +
              '<text x="' + (padL + plotW / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">' + escHtml(tr(L, 'quadrant_x', { cur: cur })) + '</text>' +
              '<text x="' + (W - padR) + '" y="' + (H - 12) + '" text-anchor="end" font-size="12" fill="currentColor" opacity="0.7">' + escHtml(fmtMoney(maxCost, cur, L)) + '</text>' +
              '<text x="' + (padL - 8) + '" y="' + (padT + 10) + '" text-anchor="end" font-size="12" fill="currentColor" opacity="0.7">' + escHtml(fmtRoas(maxRoas, L)) + '</text>' +
              '<text x="' + (padL - 8) + '" y="' + (H - padB) + '" text-anchor="end" font-size="12" fill="currentColor" opacity="0.7">0×</text>' +
              bubblesSvg +
            '</svg>' +
          '</div>' +
          '<div class="rounded-xl border border-[var(--border)] p-3.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs">' +
            '<div class="space-y-1">' +
              '<div class="flex flex-wrap items-center gap-2">' +
                '<span class="px-2 py-0.5 rounded font-semibold ' + selMeta.cls + '">' + escHtml(selMeta.icon + ' ' + selMeta.label) + '</span>' +
                '<strong class="text-sm">' + escHtml(sel.label) + '</strong>' +
                '<span class="text-[var(--muted-foreground)]">(' + escHtml(sel.camp) + ')</span>' +
              '</div>' +
              '<div class="text-[var(--muted-foreground)]">' + escHtml(sel.reason) + '</div>' +
            '</div>' +
            '<div class="flex flex-wrap items-center gap-3 tabular-nums font-semibold">' +
              '<span>' + escHtml(tr(L, 'col_spend')) + ': ' + escHtml(fmtMoney(sel.cost, cur, L)) + '</span>' +
              '<span>Conv.: ' + escHtml(fmtNum(sel.conv, L, 1)) + '</span>' +
              '<span>ROAS obs.: ' + escHtml(fmtRoas(sel.obsRoas, L)) + '</span>' +
              '<span>ROAS post.: ' + escHtml(fmtRoas(sel.postRoas, L)) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';

      stage.querySelectorAll('g[data-bidx]').forEach(g => {
        const idx = Number(g.getAttribute('data-bidx'));
        g.addEventListener('click', () => {
          state.selectedBubbleIdx = idx;
          updateAbTaglineVisibility();
          renderExplorer();
        });
      });
    }

    function renderNgramsTab(stage, b, stRows, kwRows, cur) {
      const L = state.lang;
      const emp = (b.empirical_ngrams || []).slice(0, 8);
      const maxEmpCost = Math.max(1, ...emp.map(e => e.cost));
      const winners = stRows.filter(r => r.conv > 0).concat(
        kwRows.filter(k => k.bucket === 'P2_SCALE').map(k => ({ term: '[' + k.keyword + ']', val: k.val, conv: k.conv, roas_post: k.roas_post, bucket: k.bucket }))
      ).sort((a, z) => z.val - a.val).slice(0, 8);
      const maxWinVal = Math.max(1, ...winners.map(w => w.val));

      stage.innerHTML =
        '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">' +
          '<div class="rounded-xl border border-[var(--border)] p-4 space-y-3">' +
            '<h3 class="text-sm font-bold m-0">' + escHtml(tr(L, 'ngram_emp_title', { cur: cur })) + '</h3>' +
            (emp.length === 0
              ? '<p class="text-xs text-[var(--muted-foreground)]">0 n-grams</p>'
              : emp.map(e => {
                  const pctW = Math.max(6, Math.round((e.cost / maxEmpCost) * 100));
                  const barCol = e.roas >= 2.4 ? '#059669' : (e.roas < 1.2 ? '#e11d48' : '#64748b');
                  return (
                    '<div class="space-y-1 text-xs">' +
                      '<div class="flex items-center justify-between gap-2 tabular-nums">' +
                        '<span class="font-semibold truncate">"' + escHtml(e.ngram) + '" <span class="text-[var(--muted-foreground)]">(' + e.n_terms + ')</span></span>' +
                        '<span>' + escHtml(fmtMoney(e.cost, cur, L)) + ' · ROAS ' + escHtml(fmtRoas(e.roas, L)) + '</span>' +
                      '</div>' +
                      '<div class="w-full h-2.5 rounded-full overflow-hidden border border-[var(--border)]">' +
                        '<div style="width:' + pctW + '%;background:' + barCol + ';" class="h-full rounded-full"></div>' +
                      '</div>' +
                    '</div>'
                  );
                }).join('')) +
          '</div>' +
          '<div class="rounded-xl border border-[var(--border)] p-4 space-y-3">' +
            '<h3 class="text-sm font-bold m-0">' + escHtml(tr(L, 'ngram_pos_title', { cur: cur })) + '</h3>' +
            (winners.length === 0
              ? '<p class="text-xs text-[var(--muted-foreground)]">0</p>'
              : winners.map(w => {
                  const pctW = Math.max(6, Math.round((w.val / maxWinVal) * 100));
                  return (
                    '<div class="space-y-1 text-xs">' +
                      '<div class="flex items-center justify-between gap-2 tabular-nums">' +
                        '<span class="font-semibold truncate">' + escHtml(w.term) + '</span>' +
                        '<span>' + escHtml(fmtMoney(w.val, cur, L)) + ' · ' + escHtml(fmtNum(w.conv, L, 1)) + ' conv.</span>' +
                      '</div>' +
                      '<div class="w-full h-2.5 rounded-full overflow-hidden border border-[var(--border)]">' +
                        '<div style="width:' + pctW + '%;background:#059669;" class="h-full rounded-full"></div>' +
                      '</div>' +
                    '</div>'
                  );
                }).join('')) +
          '</div>' +
        '</div>';
    }

            '</div>' +

            '<h3 class="text-sm font-bold m-0">' + escHtml(tr(L, 'table_kw_title')) + ' (' + kwRows.length + ')</h3>' +

      setTimeout(() => { lbl.textContent = tr(state.lang, 'share_readonly'); }, 1800);

    document.getElementById('campaignSelect').addEventListener('change', e => {
      state.campaignFilter = e.target.value || 'all';
      state.selectedBubbleIdx = 0;
      updateAbTaglineVisibility();
      renderExplorer();
    });
    document.getElementById('searchInput').addEventListener('input', e => {
      state.searchQuery = e.target.value || '';
      state.selectedBubbleIdx = 0;
      updateAbTaglineVisibility();
      renderExplorer();
    });
    document.getElementById('localCsvInput').addEventListener('change', e => {
      if (e.target.files && e.target.files[0]) {
        handleCsvUploadFile(e.target.files[0], state.brand);
        e.target.value = '';
      }
    });
    document.getElementById('btnResetLocal').addEventListener('click', () => {
      delete state.localOverrideByPeriodBrand[state.period + '::' + state.brand];
      renderAll();
    });


async function syncFromGoogleSheet(manualTrigger, optPeriod) {
  const reqPeriod = optPeriod || state.period;
  const endpoints = (DB.hub && DB.hub.google_sheet_hub && DB.hub.google_sheet_hub.endpoints) || {};
  const stBase = endpoints[reqPeriod];
  const kwBase = endpoints.active_keywords;
  const bmBase = endpoints.brand_benchmarks;
  if (!stBase || !kwBase || !bmBase) return;

  const reqSeq = (state.syncSeq = (state.syncSeq || 0) + 1);
  if (!state.syncSeqByPeriod) state.syncSeqByPeriod = {};
  state.syncSeqByPeriod[reqPeriod] = reqSeq;

  state.syncing = true;
  renderFreshnessStrip();

  const bust = '&_cb=' + Date.now();
  const isActivePeriod = reqPeriod === (DB.meta.active_period || '1m');

  try {
    const [stRes, kwRes, bmRes] = await Promise.all([
      fetch(stBase + bust, { cache: 'no-store' }),
      fetch(kwBase + bust, { cache: 'no-store' }),
      fetch(bmBase + bust, { cache: 'no-store' })
    ]);
    if (state.syncSeqByPeriod[reqPeriod] !== reqSeq) {
      if (state.syncSeq === reqSeq) { state.syncing = false; renderFreshnessStrip(); }
      return;
    }
    if (!stRes.ok || !kwRes.ok || !bmRes.ok) {
      throw new Error('HTTP ' + stRes.status + '/' + kwRes.status + '/' + bmRes.status);
    }
    const [stTxt, kwTxt, bmTxt] = await Promise.all([
      stRes.text(),
      kwRes.text(),
      bmRes.text()
    ]);
    if (state.syncSeqByPeriod[reqPeriod] !== reqSeq) {
      if (state.syncSeq === reqSeq) { state.syncing = false; renderFreshnessStrip(); }
      return;
    }

    const vSt = validateSheetCsvSchema(stTxt, 'st', isActivePeriod);
    if (!vSt.ok) throw new Error(vSt.reason);
    const vKw = validateSheetCsvSchema(kwTxt, 'kw', true);
    if (!vKw.ok) throw new Error(vKw.reason);
    const vBm = validateSheetCsvSchema(bmTxt, 'bm', true);
    if (!vBm.ok) throw new Error(vBm.reason);

    const bundleHash = fnv1aHash(stTxt) + '|' + fnv1aHash(kwTxt) + '|' + fnv1aHash(bmTxt);
    if (!manualTrigger && state.lastSyncedHashByPeriod[reqPeriod] === bundleHash && state.sheetCtxByPeriod[reqPeriod]) {
      if (state.syncSeq === reqSeq) state.syncing = false;
      if (state.period === reqPeriod) state.syncError = null;
      state.lastCheckedTs = Date.now();
      renderFreshnessStrip();
      return;
    }

    const stRows = parseGoogleAdsCsv(stTxt, '');
    const kwRows = parseActiveKeywordsCsv(kwTxt, '');
    const bmRows = parseBrandBenchmarksCsv(bmTxt, '');

    if (stRows.length < vSt.dataCount) {
      throw new Error('Rejected ' + (vSt.dataCount - stRows.length) + ' malformed or currency-mismatched row(s) in ' + reqPeriod);
    }
    if (kwRows.length === 0 || kwRows.length < vKw.dataCount) {
      throw new Error('Rejected malformed or currency-mismatched row(s) in Active_Keywords');
    }
    if (bmRows.length === 0 || bmRows.length < vBm.dataCount) {
      throw new Error('Rejected malformed or currency-mismatched row(s) in Brand_Benchmarks');
    }
    const hadLoadedBrands = Boolean(
      state.sheetCtxByPeriod[reqPeriod] &&
      Object.values(state.sheetCtxByPeriod[reqPeriod].brands || {}).some(b => b && b.live_loaded)
    );
    if (stRows.length === 0 && (reqPeriod === '1m' || hadLoadedBrands)) {
      throw new Error('Accidental 0-row wipe blocked on ' + reqPeriod);
    }
    if (reqPeriod === '1m' && stRows.filter(r => r.bs === 'fleur_quebec').length === 0) {
      throw new Error('Accidental wipe of Fleur Québec baseline rows blocked on 1_Month');
    }

    let nextCtx;
    if (reqPeriod === '1m' && matchesBaseline1mCanonical(stTxt, kwTxt, bmTxt)) {
      nextCtx = BASELINE_1M_CTX;
    } else if (!stRows.length && reqPeriod !== '1m') {
      nextCtx = null;
    } else {
      nextCtx = scoreDataset(stRows, kwRows, bmRows, reqPeriod, 'google_sheet_live');
    }

    if (nextCtx) {
      state.sheetCtxByPeriod[reqPeriod] = nextCtx;
    }
    if (state.syncSeq === reqSeq) state.syncing = false;
    if (state.period === reqPeriod) state.syncError = null;
    state.lastCheckedTs = Date.now();
    if (state.period === reqPeriod) {
      renderAll();
    } else {
      renderFreshnessStrip();
    }
    // Commit hash strictly at the end of try after scoring & render succeed
    state.lastSyncedHashByPeriod[reqPeriod] = bundleHash;
  } catch (err) {
    if (state.syncSeqByPeriod[reqPeriod] !== reqSeq) return;
    if (state.syncSeq === reqSeq) state.syncing = false;
    if (state.period === reqPeriod) {
      state.syncError = err && err.message ? err.message : String(err);
    }
    renderFreshnessStrip();
  }
}

function initLiveSyncLoop() {
  syncFromGoogleSheet(false);
  setInterval(() => {
    if (!document.hidden) syncFromGoogleSheet(false);
  }, 30000);
  setInterval(() => {
    if (state.lastCheckedTs) renderFreshnessStrip();
  }, 5000);
}


    renderAll();
    initLiveSyncLoop();
  </script>
